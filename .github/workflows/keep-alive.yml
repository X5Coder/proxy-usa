name: Keep Proxy Alive

on:
  schedule:
    # كل 4 دقائق لـ Glitch (ينام بعد 5) و 14 دقيقة لـ Render
    - cron: '*/4 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping proxy health (light)
        run: |
          echo "Pinging proxies..."
          for URL in "https://proxy-usa.onrender.com/health" "https://proxy-usa.glitch.me/health"; do
            echo "-> $URL"
            for i in 1 2 3; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$URL" || echo "000")
              echo "  Attempt $i: HTTP $CODE"
              if [ "$CODE" = "200" ]; then echo "  ✅ alive"; break; fi
              sleep 5
            done
          done
          exit 0

      - name: Optional proxy auth test (if secrets set)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        if: env.PROXY_URL != ''
        run: |
          echo "Testing proxy tunnel..."
          curl -s --max-time 20 -x "$PROXY_URL" https://ifconfig.me || echo "Proxy tunnel test skipped/failed"
