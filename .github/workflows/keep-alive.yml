name: Keep Proxy Alive

on:
  schedule:
    # كل 14 دقيقة - قبل ما Render ينيمه (15 دقيقة)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping proxy health (light)
        run: |
          echo "Pinging proxy..."
          # محاولة 3 مرات
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 https://proxy-usa.onrender.com/health || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ Proxy alive"
              exit 0
            fi
            sleep 5
          done
          echo "⚠️ Ping failed after 3 attempts - Render may be waking up"
          # لا نفشل الـ Action حتى لو Render نايم (هيصحى لوحده)
          exit 0

      - name: Optional proxy auth test (if secrets set)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        if: env.PROXY_URL != ''
        run: |
          echo "Testing proxy tunnel..."
          curl -s --max-time 20 -x "$PROXY_URL" https://ifconfig.me || echo "Proxy tunnel test skipped/failed"
