name: Android APK (cloud build)

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

name: Android APK (cloud build)

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipnet-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Release (phone direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "IPNET Android (latest)"
          body: "Download app-debug.apk directly on your phone and install."
          files: android/app/build/outputs/apk/debug/app-debug.apk

