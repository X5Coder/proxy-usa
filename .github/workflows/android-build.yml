name: Android APK (cloud build)

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android NDK (for sslocal cross-build)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build sslocal for arm64 Android (~4MB)
        run: |
          cargo install cargo-ndk --locked
          git clone --branch v1.24.0 --depth 1 https://github.com/shadowsocks/shadowsocks-rust ss-rust
          cd ss-rust
          cargo ndk -t arm64-v8a build --release --bin sslocal \
            --no-default-features --features "local,aead-cipher,logging,multi-threaded"
          cd ..
          mkdir -p app/src/main/assets/bin/arm64-v8a
          cp ss-rust/target/aarch64-linux-android/release/sslocal app/src/main/assets/bin/arm64-v8a/sslocal
          # Second copy as a "native lib": the package manager installs it
          # executable, immune to the error=13 EACCES seen on Android 14.
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp ss-rust/target/aarch64-linux-android/release/sslocal app/src/main/jniLibs/arm64-v8a/libsslocal.so
          ls -la app/src/main/assets/bin/arm64-v8a/ app/src/main/jniLibs/arm64-v8a/

      - name: Build hev-socks5-tunnel JNI lib (arm64)
        run: |
          mkdir -p hev-wrap && cd hev-wrap
          git clone --branch 2.17.1 --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel jni
          "$ANDROID_NDK_HOME/ndk-build" APP_ABI=arm64-v8a
          cd ..
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp hev-wrap/libs/arm64-v8a/libhev-socks5-tunnel.so app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK (arm64, shrunk)
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipnet-android-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Remove old APK from release
        run: gh release delete-asset android-latest app-release.apk --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Release (phone direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "IPNET Android (latest)"
          body: "Download app-release.apk directly on your phone and install."
          files: android/app/build/outputs/apk/release/app-release.apk

